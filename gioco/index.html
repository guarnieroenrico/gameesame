<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>L'isola · gioco di maturità</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#9fc7e6;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#fff;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#fade{position:fixed;inset:0;background:#06121c;pointer-events:none;transition:opacity 2.6s ease .2s}body.ready #fade{opacity:0}
#status{position:fixed;left:0;right:0;top:46%;text-align:center;letter-spacing:.08em;font-size:15px;z-index:3}
.cap{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));text-shadow:0 2px 12px #000a;opacity:0;transition:opacity 2s ease 2.4s;pointer-events:none}
body.ready .cap{opacity:1}.cap small{display:block;letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:#ffe08a;margin-bottom:6px}.cap h1{font-size:clamp(22px,4vw,36px);margin:0;font-weight:600}
.hint{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.1em;text-shadow:0 1px 8px #000a;opacity:0;transition:opacity 2s ease 4s;pointer-events:none}body.ready .hint{opacity:.85}
#joy{position:fixed;left:max(26px,env(safe-area-inset-left));bottom:max(90px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
@media(pointer:coarse){#joy{display:block}}
</style></head><body>
<div id="fade"></div><div id="status">Costruisco l'isola…</div>
<div class="hint">W A S D / FRECCE per camminare · TRASCINA per guardarti intorno · SHIFT per correre</div>
<div class="cap"><small>Esame di maturità</small><h1>L'isola</h1></div>
<div id="joy"><i></i></div>
