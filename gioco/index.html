<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>MULTIVERSE · Il viaggio tra le dimensioni</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#02050c;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#fff;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#start{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:radial-gradient(ellipse at 50% 120%,#10244a,#02050c 70%);transition:opacity 2.5s ease}
body.go #start{opacity:0;pointer-events:none}
#start small{letter-spacing:.3em;color:#9db8ff;font-size:12px;text-transform:uppercase}
#start h1{font-size:clamp(34px,8vw,84px);letter-spacing:.14em;margin:0;font-weight:400}
#start p{margin:0;color:#c8d4f0;font-style:italic;letter-spacing:.06em}
#start em{font-size:12px;color:#7f93c0;letter-spacing:.12em;margin-top:6px}
#go{margin-top:30px;padding:12px 44px;font:inherit;letter-spacing:.3em;color:#fff;background:none;border:1px solid #9db8ff;cursor:pointer;opacity:0;pointer-events:none;transition:.4s}
body.ready #go{opacity:1;pointer-events:auto}#go:hover{background:#9db8ff33}
body.ready #status{display:none}
.lid{position:fixed;left:0;right:0;height:50%;background:#000;z-index:5;pointer-events:none;display:none}#l1{top:0}#l2{bottom:0}body.go .lid{display:block}
#sub{position:fixed;left:0;right:0;bottom:16%;text-align:center;z-index:7;font-size:clamp(18px,2.6vw,28px);font-style:italic;letter-spacing:.04em;color:#e8eeff;text-shadow:0 2px 14px #000;pointer-events:none}
.hint{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.1em;text-shadow:0 1px 8px #000a;opacity:0;transition:opacity 2s ease 1s;pointer-events:none}body.play .hint{opacity:.8}
#joy{position:fixed;left:26px;bottom:90px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
@media(pointer:coarse){#joy{display:block}}
</style></head><body>
<div id="start"><small>Esame di maturità</small><h1>MULTIVERSE</h1><p>Il viaggio tra le dimensioni</p><div id="status">Costruisco l'isola…</div><button id="go">INIZIA</button><em>Usa le cuffie · alza il volume</em></div>
<div class="lid" id="l1"></div><div class="lid" id="l2"></div><div id="sub"></div>
<div class="hint">W A S D / FRECCE per camminare · TRASCINA per guardarti intorno · SHIFT per correre</div>
<div id="joy"><i></i></div>

<script type="module" src="isola.js"></script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body></html>
